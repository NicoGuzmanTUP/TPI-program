services:
  db:
    image: postgres:16-alpine
    container_name: foodstore_db
    environment:
      POSTGRES_USER: foodstore
      POSTGRES_PASSWORD: foodstore
      POSTGRES_DB: foodstore_db
    ports:
      - "5433:5432"
    volumes:
      - foodstore_pgdata:/var/lib/postgresql/data

volumes:
  foodstore_pgdata: